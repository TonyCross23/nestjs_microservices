version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ms_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: main_db
    ports:
      - '5438:5432'

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ms_rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'